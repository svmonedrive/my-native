<div class="bg" aria-hidden="true"></div>

@if (videoUrl(); as url) {
  <div class="video" aria-hidden="true">
    <iframe
      [src]="url"
      title="Background video"
      tabindex="-1"
      allow="autoplay; encrypted-media"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>
}

<div class="layer">
  <div class="content" libReveal>
    <h1>{{ titleKey() | t }}</h1>
    @if (taglineKey(); as tagline) {
      <strong class="tagline">{{ tagline | t }}</strong>
    }
    <p>{{ subtitleKey() | t }}</p>
    <a class="cta" [href]="'#' + ctaTarget()" (click)="go($event)">{{ ctaKey() | t }}</a>
  </div>
</div>
