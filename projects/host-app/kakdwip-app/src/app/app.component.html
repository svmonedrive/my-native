<lib-site-header brandKey="app.title" [links]="links" />

<main>
  <lib-hero-section
    id="home"
    titleKey="hero.title"
    subtitleKey="hero.subtitle"
    ctaKey="hero.cta"
    ctaTarget="services"
  />
  <lib-services-section
    id="services"
    titleKey="services.title"
    subtitleKey="services.subtitle"
    [services]="apps"
  />
  <lib-event-timeline
    id="events"
    titleKey="events.title"
    subtitleKey="events.subtitle"
    [events]="events"
  />
  <lib-map-section
    id="location"
    titleKey="location.title"
    subtitleKey="location.subtitle"
    [addressKey]="location.addressKey"
    [lat]="location.lat"
    [lng]="location.lng"
  />
  <lib-contact-form
    id="contact"
    titleKey="contact.title"
    subtitleKey="contact.subtitle"
    (submitted)="onContact($event)"
  />
</main>

<footer>
  <p>{{ 'footer.rights' | t: { year: year } }}</p>
</footer>

<router-outlet />
